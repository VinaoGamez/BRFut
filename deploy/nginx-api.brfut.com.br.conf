# nginx — api.brfut.com.br
# Copie para /etc/nginx/sites-available/brfut-api e ative com sites-enabled.
# Requer deploy/nginx-brfut-rate-limit.conf em /etc/nginx/conf.d/

upstream brfut_api {
    server 127.0.0.1:5081;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.brfut.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.brfut.com.br;

    ssl_certificate     /etc/letsencrypt/live/api.brfut.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.brfut.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 2m;

    location = /api/auth/login {
        limit_req zone=brfut_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://brfut_api;
        include /etc/nginx/snippets/brfut-api-proxy.conf;
    }

    location = /api/auth/register {
        limit_req zone=brfut_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://brfut_api;
        include /etc/nginx/snippets/brfut-api-proxy.conf;
    }

    location = /api/auth/google {
        limit_req zone=brfut_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://brfut_api;
        include /etc/nginx/snippets/brfut-api-proxy.conf;
    }

    location /api/ {
        limit_req zone=brfut_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://brfut_api;
        include /etc/nginx/snippets/brfut-api-proxy.conf;
    }

    location / {
        return 404;
    }
}
