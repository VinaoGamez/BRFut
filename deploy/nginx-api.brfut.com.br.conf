# nginx — api.brfut.com.br
# Copie para /etc/nginx/sites-available/brfut-api e ative com sites-enabled.

upstream brfut_api {
    server 127.0.0.1:5081;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.brfut.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.brfut.com.br;

    # Certbot preenche estes paths após: certbot --nginx -d api.brfut.com.br
    ssl_certificate     /etc/letsencrypt/live/api.brfut.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.brfut.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 2m;

    location /api/ {
        proxy_pass http://brfut_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location / {
        return 404;
    }
}
