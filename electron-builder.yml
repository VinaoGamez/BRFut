# Empacotamento desktop do BR Fut.
#
# Só o `dist/` e o `electron/` entram no pacote. O repositório tem 167 MB — com
# node_modules, fontes e páginas de laboratório — e nada disso deve ir para o
# instalador.

appId: br.com.brfut.desktop
productName: BR Fut
copyright: BR Fut

directories:
  output: release
  buildResources: electron/build

files:
  - dist/**/*
  - electron/main.cjs
  - electron/preload.cjs
  - package.json

# Chromium já traz o assar; não vale zipar 63 MB de PNG de novo.
asar: true

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: BR-Fut-${version}-instalador.${ext}
  # Ícone próprio: sem isso o Windows usa o ícone padrão do Electron.
  icon: electron/build/icon.ico
  # O passo de assinar/editar o executável baixa o cache `winCodeSign`, que só
  # descompacta com privilégio de symlink — bloqueado sem Developer Mode ou
  # administrador. Como o app não é assinado, esse passo é desnecessário.
  # Preço: o .exe sai sem ícone embutido e sem metadados de versão. Ligar o
  # Developer Mode em Configurações > Atualização e Segurança > Para
  # desenvolvedores devolve os dois, e é o caminho para a versão polida.
  signAndEditExecutable: false

nsis:
  # Assistente em vez de instalação silenciosa: o usuário escolhe a pasta e
  # desinstala pelo Painel de Controle.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: BR Fut
  installerLanguages:
    - pt_BR
  language: '1026'
  displayLanguageSelector: false
  deleteAppDataOnUninstall: false

# Sem repositório, sem updates automáticos e sem download de código em tempo de
# execução: o instalador é a fonte, e o que roda é o que foi empacotado.
publish: null