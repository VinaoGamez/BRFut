name: Deploy testers (GitHub Pages)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm run security:secrets
      - run: npm run build
        env:
          # Somente valores públicos entram no Vite. Segredos nunca devem ser
          # adicionados a este job, pois seriam incorporados ao bundle.
          GITHUB_PAGES: 'true'
          BRFUT_API_ORIGIN: ${{ vars.BRFUT_API_ORIGIN || 'https://api.brfut.com.br' }}
          BRFUT_AUTH_REQUIRED: ${{ vars.BRFUT_AUTH_REQUIRED || 'true' }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
