name: Desktop release (draft)

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    env:
      BRFUT_PYTHON: python
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.3.0
      - run: npm ci
      - run: npm run release:check -- "$env:RELEASE_TAG"
      - run: npm run test:all
      - run: npm run desktop:dist
      - run: npm run release:checksums -- "$env:RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: brfut-${{ github.ref_name }}-windows
          path: |
            release/BR-Fut-*-instalador.exe
            release/CHECKSUMS.sha256
          retention-days: 7
      - name: Create draft for owner review (never overwrite a release)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const tag = `v${pkg.version}`;
            if (context.ref !== `refs/tags/${tag}`) throw new Error('Tag/version mismatch');
            let exists = false;
            try {
              await github.rest.repos.getReleaseByTag({ ...context.repo, tag });
              exists = true;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (exists) throw new Error('This version already has a release. Use a new version; never overwrite it.');
            const body = fs.readFileSync(`docs/releases/${pkg.version}.md`, 'utf8');
            const { data: release } = await github.rest.repos.createRelease({
              ...context.repo, tag_name: tag, name: `BR Fut ${pkg.version}`,
              body, draft: true, prerelease: false,
            });
            for (const name of [`BR-Fut-${pkg.version}-instalador.exe`, 'CHECKSUMS.sha256']) {
              await github.rest.repos.uploadReleaseAsset({
                ...context.repo, release_id: release.id, name,
                data: fs.readFileSync(path.join('release', name)),
              });
            }
